[build-system]
requires = [
  # 77 is the first setuptools with PEP 639 licence metadata (an SPDX `license` string and
  # `license-files`).
  "setuptools >= 77",
  "wheel",
  "setuptools_scm[toml]>=3.4"
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
write_to = "grassp/_version.py"
fallback_version = "0.0.1"
# Match only this package's own tags. release-please releases the R package in r/grasspio
# from the same run, tagging the same commit as grasspio-v*, and `git describe` returns that
# ahead of v0.5.0. setuptools_scm's default tag_regex allows a leading name, so it read
# grasspio-v0.1.0 as 0.1.0 and the build produced the wrong version.
git_describe_command = "git describe --dirty --tags --long --abbrev=40 --match v[0-9]*"
tag_regex = '^v(?P<version>\d+(?:\.\d+){0,2}.*)$'

[project]
name =  "grassp"
description = "A python package to facilitate Organellar profiling"
readme = "README.md"
license = "BSD-3-Clause"
# Shipped in every wheel and sdist: BSD-3-Clause requires redistributing the notice.
license-files = ["LICENSE"]
# 3.12 is the floor because scanpy (>= 1.12), anndata, numpy and scipy all require it: on 3.11
# the resolver could only pick their last 3.11-compatible releases, and scanpy 1.11's ingest is
# broken against pynndescent >= 0.7. Also SPEC 0, which drops each Python 3 years after release.
requires-python = ">=3.12, <4.0"

# the dynamically determined project metadata attributes
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# list package dependencies here
dependencies = [
    "adjustText",
    "anndata",
    "markov_clustering",
    "matplotlib",
    "networkx",
    "numba",
    "numpy",
    "pandas",
    "protdata",
    "pysankeybeta",
    "requests",
    "scanpy[leiden] >= 1.10",
    "scikit-learn",
    "scipy",
    "seaborn",
    # umap-learn 0.6.0 (2026-11-10) made the numba nearest_neighbors kernel demand C-contiguous
    # distances, and scanpy 1.12's sc.pp.neighbors passes a non-contiguous float32 array, so
    # every neighbors call fails with a TypingError. Lift the pin once scanpy or umap is fixed.
    "umap-learn < 0.6",
#    "alphastats",
]


[project.optional-dependencies]
# note that dev dependencies are only pinned to major versions
dev = [
    "black~=25.1",
    "flake8~=7.0",
    # Same major version as the isort hook in .pre-commit-config.yaml, which CI runs: 5 and 6
    # disagree on blank lines between function-level imports.
    "isort~=6.0",
    "pre-commit~=4.0",
    "pylint~=3.0",
    "pytest~=8.0",
    "xlrd",
    "gseapy",
    # Without these the tests that need them skip rather than fail, so CI -- which installs
    # only this extra -- silently stopped covering the ternary plots (mpltern) and the 30
    # real-.rda pRolocdata reader tests (rdata, also in the `proloc` extra).
    "mpltern",
    "rdata",
    # alphabase-backed reading of search-engine output. tests/test_alphabase_interop.py checks
    # that its output still matches protdata's after the manual steps in the alphapepttools
    # tutorial; the module skips when this is missing.
    "alphapepttools",
]
notebook = [
    "jupyter",
    "matplotlib",
    "jupytext",
]
# C-COMPASS integration (gr.tl.ccompass). Pulls in tensorflow/keras via ccompass.
# tensorboard is required by keras-tuner but missing from ccompass's metadata.
#
# This is the one extra that does not reach the Python versions the rest of grassp supports:
# tensorflow publishes no cp314 wheels, so `grassp[ccompass]` needs Python <= 3.13. Everything
# else, including the docs and test extras, resolves on 3.14.
ccompass = [
    "ccompass",
    "tensorboard",
]
# pRoloc / pRolocdata interoperability. `rdata` is a pure-Python R-data parser, needed only
# by gr.io.read_prolocdata to read .rda/.rds files; the h5ad round trip needs nothing at all,
# since it is anndata's own read_h5ad/write_h5ad in both directions.
# The R half is a separate package in this repo:
#   remotes::install_github("czbiohub-sf/grassp", subdir = "r/grasspio")
proloc = [
    "rdata",
]
build = [
    "twine",
    "build",
]
docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "scanpydoc[theme,typehints] >=0.15.1",
    "sphinx-book-theme",
    "myst_parser",
    "myst-nb",
    # The R tutorial is an .Rmd page source; jupytext converts it for myst-nb to execute.
    # Executing it additionally needs the conda environment in r-environment.yml, with IRkernel
    # registered as the `ir` kernelspec -- run `make setup-r`. See docs/source/conf.py.
    "jupytext",
    # Needed to *execute* the tutorials, not merely to render them: OrgIP_tutorial calls
    # gr.tl.calculate_cluster_enrichment (gseapy), and the ternary plots need mpltern. Without
    # them those pages fail to a myst-nb warning and ship with a traceback embedded.
    "gseapy",
    "mpltern",
    # The pRoloc tutorial reads a pRolocdata .rda with gr.io.read_prolocdata, which needs this.
    "rdata",
    # The alphapepttools tutorial reads a MaxQuant table through alphabase at build time.
    "alphapepttools",
]

[project.urls]
homepage = "https://github.com/czbiohub-sf/grassp"
documentation = "https://czbiohub-sf.github.io/grassp/"
repository = "https://github.com/czbiohub-sf/grassp"
changelog = "https://github.com/czbiohub-sf/grassp/blob/main/CHANGELOG.md"


[tool.setuptools]
# allow use of __file__ to load data files included in the package
zip-safe = false

# Discover subpackages instead of listing only the top level. The previous
# `packages = ["grassp"]` was a flat list, so which subpackage modules ended up in a wheel
# depended on a stale egg-info/SOURCES.txt rather than on the config -- newly added modules
# were silently omitted, making `import grassp.io` fail from a released wheel.
[tool.setuptools.packages.find]
include = ["grassp*"]

[tool.setuptools.package-data]
"grassp.datasets" = ["external/*"]
# `fixtures/`, not `data/`: .gitignore has a bare `data/` rule that matches at any depth.
"grassp.tests" = ["fixtures/*"]


[tool.black]
line-length = 95
# Matches requires-python. black 25.1 has no py314 target yet.
target-version = ['py312', 'py313']
include = '\.pyi?$'
skip-string-normalization = true
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv[^/]*
    | _build
    | build
    | dist
    | notebooks
    | ignore
  )/
)
'''


[tool.isort]
profile = "black"
line_length = 95
lines_between_types = 1
default_section = "THIRDPARTY"
no_lines_before = ["STDLIB",]
ensure_newline_before_comments = true


[tool.pylint]
# disable all conventions, refactors, warnings (C, R, W) and the following:
# E0401: unable-to-import (since it is possible that no one environment has all required packages)
# E1136: unsubscriptable-object (anecdotal false positives for numpy objects)
disable = ["C", "R", "W", "unsubscriptable-object", "import-error"]
# numpy's C extensions are opaque to static inference, which makes pylint report
# e.g. numpy.random.RandomState as a missing member. Letting it import numpy
# resolves those without suppressing no-member everywhere.
extension-pkg-allow-list = ["numpy"]
msg-template = "{line},{column},{category},{symbol}:{msg}"
reports = "n"


[tool.pytest.ini_options]
log_cli = false
