# Conda environment for the R half of grassp.
#
# This covers three things the Python environment cannot: the `grasspio` package's dependencies,
# pRoloc itself, and the R Jupyter kernel that the Sphinx build uses to execute
# docs/source/tutorials/proloc_r_tutorial.Rmd.
#
# Create it with `make setup-r` from the repository root. That wrapper matters, because two steps
# are not expressible here and are easy to forget:
#
#   1. `IRkernel::installspec()` — registers the `ir` kernel with Jupyter. Without it the docs
#      build cannot execute the R tutorial, and fails that one page to a *warning* rather than an
#      error, so the page ships with a traceback in it.
#   2. `R CMD INSTALL r/grasspio` — grasspio lives in this repository, not on a channel.
#
# On Apple silicon the environment must be built for osx-64: bioconductor-msnbase has no
# osx-arm64 build, because its affyio dependency is missing there. Rosetta runs the x86_64
# packages without trouble. `make setup-r` sets CONDA_SUBDIR accordingly; on Linux and Intel
# macOS it is a no-op.
name: grassp-r
channels:
  - conda-forge
  - bioconda
dependencies:
  # anndataR needs >= 4.5, which sets the floor for everything else.
  - r-base >=4.5

  # --- the bridge ------------------------------------------------------------------------
  # anndataR is scverse's native R implementation of the AnnData on-disk spec, and grasspio's
  # only hard dependency. rhdf5 is listed explicitly because anndataR calls it but declares it
  # only in Suggests, so nothing else pulls it in — and its absence surfaces as a confusing
  # "there is no package called 'rhdf5'".
  - bioconductor-anndatar
  - bioconductor-rhdf5
  - bioconductor-msnbase

  # Rcpp is pinned only to keep mzR quiet. MSnbase pulls in mzR, whose .onLoad compares the
  # installed Rcpp against the one it was compiled against — a strict `!=`, on macOS and Windows
  # only — and warns on any difference, compatible or not. bioconda built mzR 2.44.0 against
  # r-rcpp 1.1.1 while conda-forge has moved to 1.1.2, so an unpinned environment loads MSnbase
  # with a five-line warning about linker issues. Nothing here calls mzR (it reads raw MS files;
  # grasspio and the tutorials only ever handle quantitative MSnSets), so the warning is noise —
  # but the Sphinx build executes proloc_r_tutorial.Rmd, which means it lands in the published
  # page's first code cell, where it reads as a broken install.
  #
  # Drop this pin once bioconda rebuilds mzR against a newer Rcpp; if it ever becomes
  # unsatisfiable, `make setup-r` will fail loudly here, which is the point.
  - r-rcpp ==1.1.1

  # --- analysis, and the data the R tutorial reads ---------------------------------------
  # Both are in bioconda, contrary to what this repo's R README used to say, so nothing here
  # needs a C++ toolchain or a source build.
  - bioconductor-proloc
  - bioconductor-prolocdata

  # --- rendering -------------------------------------------------------------------------
  # knitr and rmarkdown build the grasspio vignette; pandoc is what rmarkdown shells out to, and
  # it lives only inside this environment, so anything that renders must put its bin/ on PATH.
  - r-knitr
  - r-rmarkdown
  - pandoc

  # --- executing the .Rmd tutorial as a notebook in the Sphinx build ---------------------
  # jupyter_core is here for one reason: IRkernel::installspec() shells out to the `jupyter`
  # executable, which otherwise only exists in the *Python* environment. Without it, registering
  # the kernel fails with "error in running command".
  - r-irkernel
  - jupyter_core

  # --- tests and manual installs ---------------------------------------------------------
  - r-testthat >=3.0
  - r-biocmanager
