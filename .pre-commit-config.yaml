# Each branch carries its own trailing slash: with a single `/` after the group the
# `docs/` branch could only ever match the literal path `docs//`, so nothing under
# docs/ (nor tests/artifacts/) was actually excluded.
exclude: ^(docs/(?!source/tutorials/notebooks)|notebooks/|ignore/|tests/artifacts/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      # Not on bundled data: in a TSV a trailing tab is an empty last column
      # (hsap_markers.tsv's marker_hein2025_gt), and the fixers would delete it.
      - id: trailing-whitespace
        exclude: &data_files ^grassp/(datasets/external|tests/fixtures)/
      - id: mixed-line-ending
        exclude: *data_files
      - id: end-of-file-fixer
        exclude: *data_files
      - id: requirements-txt-fixer

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-log-warn
      - id: python-no-eval

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
    - id: isort

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
    - id: black
      entry: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.5.0
    hooks:
    - id: flake8
      entry: flake8
      args: [--statistics]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: ^docs/source/tutorials/notebooks/.*\.ipynb$
        # The C-COMPASS tutorial is excluded from build-time execution in
        # docs/source/conf.py, so it has to ship with its outputs intact.
        exclude: ^docs/source/tutorials/notebooks/ccompass_tutorial\.ipynb$
