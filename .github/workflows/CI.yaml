name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor (see requires-python); 3.14 is the newest the `dev` extra resolves
        # on. The `ccompass` extra does not reach 3.14 -- tensorflow publishes no cp314 wheels --
        # but CI does not install it.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install HDF5 and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev

    - name: Install the package
      run: pip install -e .'[dev]'

    - name: Run formatting/linting
      run:  make lint

    - name: Run tests
      run: make test
