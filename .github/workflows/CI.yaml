name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR branch supersedes the run already in progress for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint is its own job, run once. It used to be a step before the tests in every matrix leg,
  # so a formatting failure skipped all the tests and fail-fast cancelled the other legs -- for
  # from 2026-09-24 to 2026-10-06 no test ran on main at all.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    # The hooks pin their own versions of isort, black and flake8, so this is the same check a
    # contributor's `git commit` runs. It includes isort, which `make lint` did not.
    - name: pre-commit hooks
      run: |
        pip install pre-commit
        pre-commit run --all-files --show-diff-on-failure

    # pylint has to import grassp's dependencies to infer types, so it is not a pre-commit hook.
    # Only the runtime dependencies: the dev extra's heavy test-only packages add nothing here.
    - name: pylint
      run: |
        pip install -e . "pylint~=3.0"
        python -m pylint grassp

  test:
    runs-on: ubuntu-latest
    strategy:
      # Let every Python version finish, so a failure on one shows whether the others pass too.
      fail-fast: false
      matrix:
        # 3.12 is the floor (see requires-python); 3.14 is the newest the `dev` extra resolves
        # on. The `ccompass` extra does not reach 3.14 -- tensorflow publishes no cp314 wheels --
        # but CI does not install it.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install HDF5 and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev

    # The dev extra carries every optional package the tests use (gseapy, mpltern, rdata,
    # alphapepttools). A test whose package is missing skips rather than fails, so leaving one
    # out silently drops its coverage.
    - name: Install the package
      run: pip install -e .'[dev]'

    - name: Run tests
      run: make test

    - name: Run doctests
      run: make test-doctest
